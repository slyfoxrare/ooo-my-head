<!-- Portfolio Grid Section -->
<section id="portfolio" class="bg-light-gray" style="background-color: #A1887F; color: rgb(255, 255, 255);">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Portfolio</h2>
                <h3 class="section-subheading text-muted" style="color: rgb(255, 255, 255);">Discover our innovative and impactful projects.</h3>
            </div>
        </div>
        <div class="row">
        {% for post in site.posts limit:3 %}
            <div class="col-md-4 col-sm-6 portfolio-item">
                <a href="#portfolioModal{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
                    <div class="portfolio-hover">
                        <div class="portfolio-hover-content">
                            <i class="fa fa-plus fa-3x"></i>
                        </div>
                    </div>
                    <img src="img/portfolio/{{ post.thumbnail }}" class="img-responsive img-centered" alt="">
                </a>
                <div class="portfolio-caption">
                    <h4 style="color: black;">{{ post.title }}</h4>
                    <p class="text-muted" style="color: black;">{{ post.subtitle }}</p>
                </div>
            </div>
        {% endfor %}
        </div>
    </div>
</section>
